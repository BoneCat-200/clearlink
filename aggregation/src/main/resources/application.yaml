server:
  port: 8003
  shutdown: graceful

spring:
  application:
    name: clearlink-aggregation
  lifecycle:
    timeout-per-shutdown-phase: 30s
  datasource:
    # 聚合服务使用独立命名的分片配置，避免命中 admin/project jar 里的同名文件
    driver-class-name: org.apache.shardingsphere.driver.ShardingSphereDriver
    url: jdbc:shardingsphere:classpath:shardingsphere-config-aggregation.yaml
  data:
    redis:
      host: 127.0.0.1
      port: 6379
      password: 123456
  cloud:
    nacos:
      discovery:
        server-addr: 127.0.0.1:8848

aggregation:
  # 聚合模式下没有独立的 project 实例，admin 的 Feign 直接调本机自己
  remote-url: http://127.0.0.1:${server.port}

short-link:
  code:
    # 短码生成实现：
    #   segment（默认）：号段发号器 + Base62 + 仿射混淆
    #   hash：旧的 MurmurHash + 布隆判重，作为回滚开关保留
    generator: segment
    # t_segment 中的业务标识
    biz-tag: short-link:uri
    # 当前号段剩余低于该比例时，异步预取下一段
    prefetch-ratio: 0.1
    obfuscator:
      # 仿射变换参数。A 必须与 62 互质（奇数且不是 31 的倍数）。
      # 上线后不能修改：改参数会让已发出的短码解码到错误的 ID
      a: 1000003
      b: 987654321
  group:
    max-num: 20
  login-security:
    # 连续失败达到该次数后锁定账号
    max-fail-count: 5
    # 失败计数的统计窗口，单位分钟
    fail-window-minutes: 15
    # 锁定时长，单位分钟
    lock-minutes: 15
    # 新密码长度下限与上限（只约束注册/修改，历史密码仍可登录）
    password-min-length: 8
    password-max-length: 32
  idempotent:
    # 写接口一次性 Token 校验。关闭后切面不注册，回滚为无 Token 模式
    enabled: true
    # Token 有效期，单位分钟
    token-ttl-minutes: 10
  flow-limit:
    # 风控过滤器挂载在 /* 上，短链接跳转也会被按 IP 限流；
    # 公网部署时若开启，需要先确认它不会误伤正常的跳转流量
    enable: false
    time-window: 1
    max-access-count: 20
  mq:
    # rocketmq：默认实现，需要 NameServer + Broker（见 deploy/rocketmq/README.md）
    # redis-stream：零外部依赖的回滚实现，改这一行即可切回
    type: rocketmq
    rocketmq:
      name-server: 127.0.0.1:9876
      topic: clearlink-stats-topic
      producer-group: clearlink-stats-producer-group
      consumer-group: clearlink-stats-consumer-group
      # 超过该次数仍消费失败，消息进入 %DLQ%clearlink-stats-consumer-group
      max-reconsume-times: 16
  cache-invalidate:
    # 延时双删开关：关闭后只保留写操作后的第一次立即删除
    enabled: true
    # RocketMQ 延时等级：默认等级表 1s 5s 10s 30s ...，2 对应 5 秒
    delay-level: 2
    topic: clearlink-cache-invalidate-topic
    producer-group: clearlink-cache-invalidate-producer-group
    consumer-group: clearlink-cache-invalidate-consumer-group
    # 删除失败后的最大重试次数，超限进入 %DLQ%
    max-reconsume-times: 8
  domain:
    # 直接访问聚合端口时使用的域名；线上由 prod profile 覆盖为公网域名
    default: 127.0.0.1:8003
    white-list:
      - 127.0.0.1:8003
  stats:
    locale:
      # 高德逆地理 key 属于个人凭据，只从环境变量注入，不写进配置文件
      amap-key: ${AMAP_KEY:}
  goto-domain:
    white-list:
      # 限制短链接可跳转的目标域名；本地联调关闭
      enable: false
      names: '拿个offer,知乎,掘金,博客园'
      details:
        - nageoffer.com
        - zhihu.com
        - juejin.cn
        - cnblogs.com
  reconcile:
    # 统计对账定时任务：默认每天 02:10 对账前一天
    cron: 0 10 2 * * ?
    # 报告里最多保存多少条不一致明细（计数本身是全量值）
    max-detail-size: 200
    # 允许手动触发对账的用户名，逗号分隔；定时任务不受此限制
    allowed-operators: admin

mybatis-plus:
  # 自定义 SQL 在 project 模块的 mapper 目录下，聚合后仍在同一个 classpath 上
  mapper-locations: classpath:mapper/*.xml

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%X{traceId:-}] [%thread] %logger{36} - %msg%n"

management:
  endpoints:
    web:
      exposure:
        # 线上只暴露必要端点；include: '*' 会把 env、beans 等敏感信息一并公开
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
