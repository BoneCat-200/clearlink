server:
  port: 8001
  # 停机时先停止接收新请求，再等待在途请求完成
  shutdown: graceful

spring:
  application:
    name: clearlink-project
  lifecycle:
    timeout-per-shutdown-phase: 30s
  datasource:
    # ShardingSphere 对 Driver 自定义，实现分库分表等隐藏逻辑
    driver-class-name: org.apache.shardingsphere.driver.ShardingSphereDriver
    # ShardingSphere 配置文件路径
    url: jdbc:shardingsphere:classpath:shardingsphere-config.yaml
  data:
    redis:
      host: 127.0.0.1
      port: 6379
      password: 123456
  cloud:
    nacos:
      discovery:
        server-addr: 127.0.0.1:8848

mybatis-plus:
  # 自定义 SQL 放在 resources/mapper 下
  mapper-locations: classpath:mapper/*.xml

short-link:
  code:
    # 短码生成实现：
    #   segment（默认）：号段发号器 + Base62 + 仿射混淆
    #   hash：旧的 MurmurHash + 布隆判重，作为回滚开关保留
    generator: segment
    # t_segment 中的业务标识
    biz-tag: short-link:uri
    # 当前号段剩余低于该比例时，异步预取下一段
    prefetch-ratio: 0.1
    obfuscator:
      # 仿射变换参数。A 必须与 62 互质（奇数且不是 31 的倍数）。
      # 上线后不能修改：改参数会让已发出的短码解码到错误的 ID
      a: 1000003
      b: 987654321
  mq:
    # 统计消息的中间件实现：
    #   rocketmq（默认）：需要 NameServer + Broker，本地启动方式见 deploy/rocketmq/README.md
    #   redis-stream：零外部依赖的回滚实现，改这一行即可切回
    # 落库与幂等逻辑在两种实现之间共用
    type: rocketmq
    rocketmq:
      name-server: 127.0.0.1:9876
      topic: clearlink-stats-topic
      producer-group: clearlink-stats-producer-group
      consumer-group: clearlink-stats-consumer-group
      # 超过该次数仍消费失败，消息进入 %DLQ%clearlink-stats-consumer-group
      max-reconsume-times: 16
  cache-invalidate:
    # 延时双删开关：关闭后只保留写操作后的第一次立即删除
    enabled: true
    # RocketMQ 延时等级：默认等级表 1s 5s 10s 30s ...，2 对应 5 秒
    delay-level: 2
    topic: clearlink-cache-invalidate-topic
    producer-group: clearlink-cache-invalidate-producer-group
    consumer-group: clearlink-cache-invalidate-consumer-group
    # 删除失败后的最大重试次数，超限进入 %DLQ%
    max-reconsume-times: 8
  domain:
    # 生成短链接时使用的默认域名。
    # 必须与「浏览器访问短链接时的 host:port」一致：跳转时 fullShortUrl 由
    # request.getServerName() + port 拼成，两边不一致会导致缓存与数据库都查不到记录
    default: 127.0.0.1:8001
    # 允许建链时通过 domain 参数指定的域名。只允许配置在这里的域名，
    # 是为了避免调用方造出一批指向其它域名（我们并不拥有）的坏链接。
    # 这里要能解析到本服务，且与下面 default 的写法保持一致（不带协议、不带末尾斜杠）
    white-list:
      - 127.0.0.1:8001
  stats:
    locale:
      # 高德逆地理的应用 key，用于把访问者 IP 转成省/市。
      # 这里只写占位符、不给默认值：key 属于个人凭据，不能进配置文件与提交历史。
      # 启动时用环境变量注入，例如 AMAP_KEY=xxxx java -jar ...
      # 不注入时消费端会跳过这次调用，地区维度统一记为「未知」，其余维度照常统计
      amap-key: ${AMAP_KEY:}
  goto-domain:
    white-list:
      # 白名单用于限制可跳转的目标域名，避免被当成开放跳板使用；本地联调关闭
      enable: false
      names: '拿个offer,知乎,掘金,博客园'
      details:
        - nageoffer.com
        - zhihu.com
        - juejin.cn
        - cnblogs.com
  reconcile:
    # 统计对账定时任务：默认每天 02:10 对账前一天
    cron: 0 10 2 * * ?
    # 报告里最多保存多少条不一致明细（计数本身是全量值）
    max-detail-size: 200
    # 允许手动触发对账的用户名，逗号分隔；定时任务不受此限制
    allowed-operators: admin

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%X{traceId:-}] [%thread] %logger{36} - %msg%n"

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
