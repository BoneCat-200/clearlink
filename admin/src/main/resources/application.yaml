server:
  port: 8002
  # 停机时先停止接收新请求，再等待在途请求完成
  shutdown: graceful

spring:
  application:
    name: clearlink-admin
  lifecycle:
    timeout-per-shutdown-phase: 30s
  datasource:
    # ShardingSphere 对 Driver 自定义，实现分库分表等隐藏逻辑
    driver-class-name: org.apache.shardingsphere.driver.ShardingSphereDriver
    # ShardingSphere 配置文件路径
    url: jdbc:shardingsphere:classpath:shardingsphere-config.yaml
  data:
    redis:
      host: 127.0.0.1
      port: 6379
      password: 123456
  cloud:
    nacos:
      discovery:
        server-addr: 127.0.0.1:8848

short-link:
  group:
    # 每个用户最多能创建的分组数
    max-num: 20
  login-security:
    # 连续失败达到该次数后锁定账号
    max-fail-count: 5
    # 失败计数的统计窗口，单位分钟
    fail-window-minutes: 15
    # 锁定时长，单位分钟
    lock-minutes: 15
    # 新密码长度下限与上限（只约束注册/修改，历史密码仍可登录）
    password-min-length: 8
    password-max-length: 32
  idempotent:
    # 写接口一次性 Token 校验。关闭后切面不注册，回滚为无 Token 模式
    enabled: true
    # Token 有效期，单位分钟
    token-ttl-minutes: 10
  flow-limit:
    # 用户流量风控：在时间窗口内限制单个调用方的请求数。
    # 本地联调默认关闭 —— 打开后自己的验证脚本会先被限流。
    # 公网部署时改成 true（也可按 profile 覆盖）。
    enable: false
    # 时间窗口，单位秒
    time-window: 1
    # 时间窗口内允许的最大访问次数
    max-access-count: 20

logging:
  pattern:
    # traceId 由 TraceIdFilter 写入 MDC；没有请求上下文时显示为空
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%X{traceId:-}] [%thread] %logger{36} - %msg%n"

management:
  endpoints:
    web:
      exposure:
        # 只暴露必要端点；include: '*' 会把 env、beans 等敏感信息一起公开
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
