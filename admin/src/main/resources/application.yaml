server:
  port: 8002

spring:
  application:
    name: clearlink-admin
  datasource:
    # ShardingSphere 对 Driver 自定义，实现分库分表等隐藏逻辑
    driver-class-name: org.apache.shardingsphere.driver.ShardingSphereDriver
    # ShardingSphere 配置文件路径
    url: jdbc:shardingsphere:classpath:shardingsphere-config.yaml
  data:
    redis:
      host: 127.0.0.1
      port: 6379
      password: 123456
  cloud:
    nacos:
      discovery:
        server-addr: 127.0.0.1:8848

short-link:
  group:
    # 每个用户最多能创建的分组数
    max-num: 20
  flow-limit:
    # 用户流量风控：在时间窗口内限制单个调用方的请求数。
    # 本地联调默认关闭 —— 打开后自己的验证脚本会先被限流。
    # 公网部署时改成 true（也可按 profile 覆盖）。
    enable: false
    # 时间窗口，单位秒
    time-window: 1
    # 时间窗口内允许的最大访问次数
    max-access-count: 20
