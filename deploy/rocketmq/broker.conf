# RocketMQ Broker 本地配置（单机、非高可用）
#
# 启动方式见同目录 README.md。几个关键项：
#   brokerIP1=127.0.0.1   避免客户端从 NameServer 拿到局域网 IP 后连不上
#   storePathRootDir      把消息落盘在工作目录内，不写用户目录
#   autoCreateTopicEnable 本地验证方便；生产环境应改成 false 并显式建 Topic

brokerClusterName=DefaultCluster
brokerName=broker-a
brokerId=0
brokerRole=ASYNC_MASTER
flushDiskType=ASYNC_FLUSH
deleteWhen=04
fileReservedTime=48

namesrvAddr=127.0.0.1:9876
brokerIP1=127.0.0.1
listenPort=10911

# 本地开发：允许自动创建 Topic / 订阅组
autoCreateTopicEnable=true
autoCreateSubscriptionGroup=true

# 消息存储目录（工作目录内，便于清理与整体迁移）
storePathRootDir=F:/project/clearlink/deploy/rocketmq/store
storePathCommitLog=F:/project/clearlink/deploy/rocketmq/store/commitlog

# 本地把 CommitLog 单文件调小，避免默认 1GB 占盘
mappedFileSizeCommitLog=134217728
