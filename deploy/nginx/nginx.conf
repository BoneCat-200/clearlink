# Clearlink 线上入口（本地生产化模拟）
#
# 启动方式（在仓库根目录执行）：
#   nginx -p F:/project/clearlink/deploy/nginx/ -c nginx.conf
# 停止：
#   nginx -p F:/project/clearlink/deploy/nginx/ -c nginx.conf -s quit
#
# 同一个域名下按路径分流：
#   /api/** → 网关(8000)，由网关做 Token 校验与用户头透传
#   其余路径 → 聚合服务(8003)，包括短链接跳转与「短链接不存在」页面

worker_processes  1;

# 日志、pid、临时目录都放在 -p 指定的前缀目录内，不污染 Nginx 安装目录
error_log  logs/error.log  info;
pid        logs/nginx.pid;

events {
    worker_connections  1024;
}

http {
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout  65;

    client_body_temp_path  temp/client_body;
    proxy_temp_path        temp/proxy;
    fastcgi_temp_path      temp/fastcgi;
    uwsgi_temp_path        temp/uwsgi;
    scgi_temp_path         temp/scgi;

    upstream clearlink_gateway {
        server 127.0.0.1:8000;
    }

    upstream clearlink_aggregation {
        server 127.0.0.1:8003;
    }

    server {
        listen       80;
        server_name  clearlink.test;

        # API：统一经网关鉴权，再转发给聚合服务
        location /api/ {
            proxy_pass http://clearlink_gateway;
            proxy_redirect off;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host  $host;
            proxy_set_header X-Forwarded-Port  $server_port;
        }

        # 短链跳转：不经过网关，直接由聚合服务处理
        location / {
            proxy_pass http://clearlink_aggregation;
            proxy_redirect off;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host  $host;
            proxy_set_header X-Forwarded-Port  $server_port;
        }
    }
}
