server:
  port: 8000
  shutdown: graceful

spring:
  application:
    name: clearlink-gateway
  lifecycle:
    timeout-per-shutdown-phase: 30s
  profiles:
    # dev：路由到独立的 admin / project 服务（微服务模式）
    # aggregation：路由到单体的聚合服务（线上部署模式）
    active: dev
  data:
    redis:
      # 与 admin 登录时写入的 Redis 是同一个库，网关据此校验 token
      host: 127.0.0.1
      port: 6379
      password: 123456
  cloud:
    nacos:
      discovery:
        server-addr: 127.0.0.1:8848
    gateway:
      httpclient:
        # 连接超时：目标实例不可达时不无限等待
        connect-timeout: ${short-link.gateway.http.connect-timeout-ms:2000}
        # 响应超时：比 Resilience4j 的 TimeLimiter 略长，让熔断器先触发、统一走降级响应
        response-timeout: ${short-link.gateway.http.response-timeout:5s}

short-link:
  gateway:
    http:
      connect-timeout-ms: 2000
      response-timeout: 5s
    rate-limit:
      # admin 是管理端流量，额度低一些；project 同时承担 API 调用，额度高一些
      admin:
        replenish-rate: 20
        burst-capacity: 40
        requested-tokens: 1
      project:
        replenish-rate: 100
        burst-capacity: 200
        requested-tokens: 1
    resilience:
      sliding-window-size: 20
      minimum-number-of-calls: 10
      failure-rate-threshold: 50
      wait-duration-in-open-state-ms: 10000
      permitted-number-of-calls-in-half-open-state: 3
      timeout-ms: 4000

logging:
  pattern:
    # 网关是 WebFlux，不建立 MDC；下游服务会补上 traceId
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%X{traceId:-}] [%thread] %logger{36} - %msg%n"

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
